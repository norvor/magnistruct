<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		
		<link rel="preconnect" href="https://fonts.googleapis.com">
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
		
		<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
		
		<style>
			/* CRITICAL GLOBAL RESET */
			:root {
				--bg-depth: #020617;   /* Slate 950 */
				--glass-border: rgba(255, 255, 255, 0.08);
				--glass-surface: rgba(15, 23, 42, 0.6);
				--primary-glow: #2dd4bf; /* Teal */
				--secondary-glow: #a855f7; /* Purple */
			}
			body {
				background-color: var(--bg-depth);
				margin: 0;
				font-family: 'Inter', sans-serif;
				color: #fff;
				overflow-x: hidden;
				-webkit-font-smoothing: antialiased;
			}
			h1, h2, h3, h4 { font-family: 'Space Grotesk', sans-serif; margin: 0; }
		</style>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
