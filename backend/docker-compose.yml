version: '3.8'

services:
  # 1. The Database (PostgreSQL)
  db:
    image: postgres:16-alpine
    container_name: magnistruct_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
      POSTGRES_DB: magnistruct
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # 2. Object Storage (MinIO - AWS S3 compatible)
  minio:
    image: minio/minio
    container_name: magnistruct_minio
    ports:
      - "9000:9000" # API Port
      - "9001:9001" # Web Console Port
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    restart: always

volumes:
  postgres_data:
  minio_data: